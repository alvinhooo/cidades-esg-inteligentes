spring:
  application: { name: cidades-esg-inteligentes }
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:esg}
    username: ${DB_USER:esg_user}
    password: ${DB_PASSWORD:esg_password}
  jpa: { hibernate: { ddl-auto: update }, open-in-view: false }
management:
  endpoints: { web: { exposure: { include: health,info } } }
  endpoint: { health: { probes: { enabled: true } } }
  info: { env: { enabled: true } }
