services:
  db-staging:
    image: postgres:16-alpine
    profiles: ["staging"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [staging-net]
  app-staging:
    build: .
    image: ${IMAGE_NAME:-cidades-esg-inteligentes:latest}
    profiles: ["staging"]
    depends_on: { db-staging: { condition: service_healthy } }
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: db-staging
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${STAGING_PORT:-8081}:8080"
    networks: [staging-net]
  db-production:
    image: postgres:16-alpine
    profiles: ["production"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [production-net]
  app-production:
    image: ${IMAGE_NAME:-cidades-esg-inteligentes:latest}
    build: .
    profiles: ["production"]
    depends_on: { db-production: { condition: service_healthy } }
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: db-production
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${PRODUCTION_PORT:-8082}:8080"
    networks: [production-net]
volumes:
  postgres-staging:
  postgres-production:
networks:
  staging-net:
  production-net:
